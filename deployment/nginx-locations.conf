# Merge INSIDE the existing canonical HTTPS server block after backing it up.
# Do not replace the existing server block, certificate, /member, /courses or /review routes.
# This sample assumes canonical https://lhtc2026.com; verify www redirect and cookie scope first.
location = /mcp {
    auth_basic off;
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Origin $http_origin;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
    access_log off;
}
location = /mcp-connect {
    auth_basic off;
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    access_log off;
}
location = /mcp-keys {
    auth_basic off;
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Cookie $http_cookie;
    client_max_body_size 4k;
    access_log off;
}
location = /mcp-health {
    auth_basic off;
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    access_log off;
}
location = /mcp-skill.zip {
    auth_basic off;
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Host $host;
    access_log off;
}
